<mat-card style="margin-bottom: 24px">
  <mat-card-header>
    <mat-card-title>Nova Nota Fiscal</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <mat-progress-bar mode="indeterminate" *ngIf="carregando"></mat-progress-bar>

    <form [formGroup]="itemForm" style="display:flex; gap:16px; flex-wrap:wrap; margin: 16px 0">
      <mat-form-field>
        <mat-label>Produto</mat-label>
        <mat-select formControlName="produtoId">
          <mat-option *ngFor="let p of produtos" [value]="p.id">
            {{ p.descricao }} (saldo: {{ p.saldo }})
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Quantidade</mat-label>
        <input matInput type="number" formControlName="quantidade" />
      </mat-form-field>

      <button mat-stroked-button type="button" (click)="adicionarItem()">
        Adicionar Item
      </button>
    </form>

    <table mat-table [dataSource]="itensNota" style="width:100%; margin-bottom:16px" *ngIf="itensNota.length > 0">
      <ng-container matColumnDef="descricao">
        <th mat-header-cell *matHeaderCellDef>Produto</th>
        <td mat-cell *matCellDef="let i">{{ i.produtoDescricao }}</td>
      </ng-container>

      <ng-container matColumnDef="quantidade">
        <th mat-header-cell *matHeaderCellDef>Quantidade</th>
        <td mat-cell *matCellDef="let i">{{ i.quantidade }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['descricao','quantidade']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['descricao','quantidade']"></tr>
    </table>

    <div style="display:flex; gap:8px; margin-top:8px">
      <button mat-raised-button color="primary" (click)="criarNota()">
        Criar Nota Fiscal
      </button>
      <button mat-stroked-button color="warn" type="button"
        *ngIf="itensNota.length > 0" (click)="cancelarNota()">
        Cancelar
      </button>
    </div>
  </mat-card-content>
</mat-card>

<mat-card>
  <mat-card-header>
    <mat-card-title>Notas Fiscais</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <mat-progress-bar mode="indeterminate" *ngIf="carregando"></mat-progress-bar>

    <table mat-table [dataSource]="notas" style="width:100%">
      <ng-container matColumnDef="numero">
        <th mat-header-cell *matHeaderCellDef>Número</th>
        <td mat-cell *matCellDef="let n">{{ n.numero }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let n">{{ n.status }}</td>
      </ng-container>

      <ng-container matColumnDef="dataCriacao">
        <th mat-header-cell *matHeaderCellDef>Data</th>
        <td mat-cell *matCellDef="let n">{{ n.dataCriacao | date:'dd/MM/yyyy HH:mm' }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let n">
          <button
            mat-raised-button
            color="accent"
            [disabled]="n.status !== 'Aberta' || imprimindo === n.id"
            (click)="imprimir(n)"
            style="margin-right: 8px">
            <mat-spinner *ngIf="imprimindo === n.id" diameter="18" style="display:inline-block; margin-right:8px"></mat-spinner>
            {{ imprimindo === n.id ? 'Imprimindo...' : 'Imprimir' }}
          </button>
          <button
            mat-stroked-button
            color="warn"
            [disabled]="n.status === 'Fechada'"
            (click)="deletarNota(n)">
            Cancelar
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <p *ngIf="!carregando && notas.length === 0" style="color:#888; margin-top:16px">
      Nenhuma nota fiscal emitida ainda.
    </p>
  </mat-card-content>
</mat-card>
